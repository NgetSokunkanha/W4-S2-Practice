<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise 3</title>
    <style>
    html, body {
        height: 100%;
    }
    body {
      font-family: sans-serif;
      margin: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 1em;
    }

    header, main, aside, footer {
      border-radius: 0.5rem;
      padding: 1rem;
      color: white;
    }

    header {
      background: #1e90ff;
      box-shadow: 0 4px 0 #0077ea;
      text-align: center;
    }

    footer {
      background: #4169e1;
      box-shadow: 0 4px 0 #1d44b8;
      text-align: center;
    }

    .content {
        flex:1;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      gap: 1rem;
      
    }

    main {
      flex: 3;
      padding:1em;
      background: #3cb371;
      box-shadow: 0 4px 0 #2f8d59;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    
    }

    aside {
      flex: 1;
      background: #ff6347;
      box-shadow: 0 4px 0 #e02200;

    }

    .item {
      background: #2f8d59;
      box-shadow: 0 4px 0 #226741;
      border-radius: 0.5rem;
      padding: 1rem;
      text-align: center;
    }


    </style>
</head>
<body>
    <header>Header</header>
    <div class="content">
        <main>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
        </main>
        <aside>sidebar</aside>
    </div>
    <footer>footer</footer>
</body>
</html>
